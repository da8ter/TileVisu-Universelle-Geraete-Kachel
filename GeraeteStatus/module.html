<head>
    <meta charset="UTF-8">
    <!-- symcon-icons-shared: Quelle visu-messung/baustein/tile-icons-shared.js, verteilt per verteilen.py -->
    <script>
/* symcon-icons-shared v1: Symcons /icons.js läuft einmal im Visu-Hauptfenster statt in jeder Kachel.
   Ersetzt das Script-Tag für /icons.js im head einer Kachel. Ohne erreichbares Hauptfenster
   (Symcon-App, direkter Aufruf, PWA) lädt die Kachel icons.js wie bisher. Symcon bleibt unverändert.
   Steht inline in einem script-Element: niemals ein schließendes Script-Tag in diesen Text schreiben.
   Quelle: visu-messung/baustein/tile-icons-shared.js, verteilt per verteilen.py - Kopien nicht von Hand ändern. */
(function () {
  var w = window, d = document, host = null;
  try {
    // Fremder Ursprung wirft schon beim Zugriff auf top.document.
    if (w.top !== w && w.top.document.head) host = w.top;
  } catch (e) {
    host = null;
  }
  var slot = host ? host.__symconIcons : null;
  if (slot && slot.v >= 1 && slot.fa) {
    teilen(slot.fa, slot.css);
    return;
  }
  // Erste Kachel (oder kein Hauptfenster): für sich laden wie bisher - synchron, damit die
  // Kachel-Skripte FontAwesome wie gewohnt vorfinden.
  d.write('<script src="/icons.js" crossorigin="anonymous"><\/script>');
  if (host && !slot) {
    // Einmal im Hauptfenster nachladen, ohne dass FontAwesome dort das Flutter-DOM anfasst.
    try {
      slot = host.__symconIcons = { v: 1, fa: null, css: '' };
      host.FontAwesomeConfig = { autoReplaceSvg: false, observeMutations: false, autoAddCss: false };
      var s = host.document.createElement('script');
      s.src = '/icons.js';
      s.onload = function () {
        if (host.FontAwesome && host.FontAwesome.dom) {
          slot.css = host.FontAwesome.dom.css();
          slot.fa = host.FontAwesome;
        }
      };
      host.document.head.appendChild(s);
    } catch (e) {
      // Hauptfenster nimmt kein Skript an: jede Kachel bleibt beim eigenen icons.js.
    }
  }

  function teilen(fa, css) {
    w.FontAwesome = fa; // findIconDefinition/i2svg der Kachel-Skripte laufen unverändert weiter
    var st = d.createElement('style');
    st.textContent = css;
    (d.head || d.documentElement).appendChild(st);
    var wandeln = function (knoten) {
      try {
        fa.dom.i2svg({ node: knoten });
      } catch (e) {
        // Knoten schon entfernt oder Hauptfenster weg: nichts zu zeichnen.
      }
    };
    // Eigener Beobachter im Fenster der Kachel: er endet mit ihr (dom.watch im Hauptfenster hielte
    // alte Kachel-Dokumente fest). Wie bei icons.js: neue Knoten und Klassenwechsel am gezeichneten SVG.
    var start = function () {
      wandeln(d.body);
      new MutationObserver(function (liste) {
        var ziele = [];
        for (var i = 0; i < liste.length; i++) {
          var m = liste[i], t = m.target;
          if (m.type === 'childList') {
            if (m.addedNodes.length && ziele.indexOf(t) < 0) ziele.push(t);
          } else if (t.getAttribute && t.getAttribute('data-fa-i2svg') !== null && anderesIcon(t)) {
            neuZeichnen(t);
          }
        }
        for (var j = 0; j < ziele.length; j++) {
          if (ziele[j].isConnected) wandeln(ziele[j]);
        }
      }).observe(d.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
    };
    if (d.body) {
      start();
    } else {
      d.addEventListener('DOMContentLoaded', start);
    }
  }

  // Nennen die Klassen des SVG ein anderes Icon als das gezeichnete (data-icon)?
  function anderesIcon(svg) {
    return (' ' + (svg.getAttribute('class') || '') + ' ').indexOf(' fa-' + svg.getAttribute('data-icon') + ' ') < 0;
  }

  // SVG durch ein <i> mit seinen Klassen ersetzen; der Beobachter zeichnet es neu.
  function neuZeichnen(svg) {
    if (!svg.parentNode) return;
    var klassen = (svg.getAttribute('class') || '').replace(/(^|\s)svg-inline--fa(?=\s|$)/g, ' ').trim();
    if (!/(^|\s)(fa-(light|brands|kit|solid|regular|thin|duotone|sharp)|fa[lbkrstd])(\s|$)/.test(klassen)) {
      klassen += ' ' + (svg.getAttribute('data-prefix') || 'fal'); // icons.js lässt die Stilklasse am SVG weg
    }
    var ersatz = d.createElement('i');
    ersatz.className = klassen;
    svg.parentNode.replaceChild(ersatz, svg);
  }
})();
    </script>
    <!-- /symcon-icons-shared -->
